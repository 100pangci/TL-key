name: Keyed Release (private draft)

# 手动触发，构建带协议常量的 APK，并创建 **draft** Release。
# draft 不会公开；请勿把带常量的 APK 发布到公开 Release。
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "用于 draft Release 的 tag（需唯一，例如 v1.0.0-keyed）"
        required: true
        default: "v1.0.0-keyed"

permissions:
  contents: write

concurrency:
  group: keyed-release-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      TLKEY_MQTT_LEGACY_USER: ${{ secrets.TLKEY_MQTT_LEGACY_USER }}
      TLKEY_MQTT_LEGACY_PASSWORD: ${{ secrets.TLKEY_MQTT_LEGACY_PASSWORD }}
      TLKEY_PROTOCOL78_KEY: ${{ secrets.TLKEY_PROTOCOL78_KEY }}
      TLKEY_PROTOCOL85_BB: ${{ secrets.TLKEY_PROTOCOL85_BB }}
      TLKEY_PROTOCOL85_JW: ${{ secrets.TLKEY_PROTOCOL85_JW }}
      TLKEY_PROTOCOL85_JD: ${{ secrets.TLKEY_PROTOCOL85_JD }}
      TLKEY_PROTOCOL85_AX: ${{ secrets.TLKEY_PROTOCOL85_AX }}
      TLKEY_PROTOCOL85_HJ: ${{ secrets.TLKEY_PROTOCOL85_HJ }}
      TLKEY_PROTOCOL85_XL: ${{ secrets.TLKEY_PROTOCOL85_XL }}
      TLKEY_PROTOCOL85_YY: ${{ secrets.TLKEY_PROTOCOL85_YY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install Android SDK packages
        run: |
          SDKMANAGER="$(command -v sdkmanager || true)"
          if [ -z "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "${ANDROID_HOME:-/usr/local/lib/android/sdk}/cmdline-tools" -name sdkmanager -type f | head -n 1)"
          fi
          if [ -z "$SDKMANAGER" ]; then
            echo "sdkmanager not found"
            exit 1
          fi
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.1.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Require signing and protocol secrets
        run: |
          missing=0
          for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD TLKEY_PROTOCOL78_KEY TLKEY_PROTOCOL85_BB; do
            if [ -z "${!name}" ]; then
              echo "::error::缺少 secret $name"
              missing=1
            fi
          done
          exit "$missing"

      - name: Prepare signing config
        run: |
          mkdir -p client/keystore
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > client/keystore/tlkey-release.jks
          chmod 600 client/keystore/tlkey-release.jks
          {
            echo "storeFile=keystore/tlkey-release.jks"
            echo "storePassword=$ANDROID_KEYSTORE_PASSWORD"
            echo "keyAlias=$ANDROID_KEY_ALIAS"
            echo "keyPassword=$ANDROID_KEY_PASSWORD"
          } > client/keystore.properties
          chmod 600 client/keystore.properties

      - name: Build keyed release
        working-directory: client
        run: >-
          ./gradlew
          :app:testDebugUnitTest
          :app:lintDebug
          :app:assembleRelease
          --stacktrace

      - name: Verify APK signature
        working-directory: client
        run: |
          apk=app/build/outputs/apk/release/app-release.apk
          test -f "$apk"
          "$ANDROID_HOME/build-tools/36.1.0/apksigner" verify --print-certs "$apk"

      - name: Create private draft release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag }}
          name: ${{ inputs.tag }} (keyed)
          body: |
            自动构建的带协议常量 APK，仅供仓库所有者私有使用。
            该 APK 包含 AES/MQTT 常量，**不要发布为公开 Release**。
          draft: true
          prerelease: true
          generate_release_notes: false
          files: client/app/build/outputs/apk/release/app-release.apk
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
